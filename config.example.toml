# mytgfs 配置模板
#
# 使用方法：复制为 config.toml 后填入自己的值。
# config.toml 已被 .gitignore 忽略，不会提交。
# 敏感值（api_hash / bot_token / user session）放 secrets/ 目录，不要写进本文件。

[telegram]
# my.telegram.org/apps 申请到的 App api_id（数字）
api_id = 0
# api_hash 不放这里，放 secrets/api_hash（单行 32 位 hex）
api_hash_file = "secrets/api_hash"
# bot token 放 secrets/bot_token（单行）
bot_token_file = "secrets/bot_token"
# 私有频道：channel_id + access_hash 由 channel init 打印
channel_id = 0
access_hash = 0
# Bot API 风格的 chat_id（-100 前缀），仅展示用
chat_id = 0

[mount]
# 托盘/面板自动增量同步间隔（秒）：0 = 默认 15，负数 = 关闭
sync_seconds = 15
# 读取上游数据的分片（MB）：0 = 默认 8，范围 1..64；网络慢可调小
read_chunk_mb = 8
# 下载并发连接数：0 = 默认 4，范围 1..8
download_parallel = 4
# 上传并发分片数：0 = 默认 4，范围 1..16
upload_parallel = 4

[web]
# 面板端口：0 = 默认 8720；被占用时自动退回随机端口
port = 8720

[downloads]
# 面板「下载」页把卷内文件写到这里；绝对路径原样使用，相对路径按配置文件所在目录解析
dir = "data/downloads"

[log]
# 日志等级：debug / info / warn / error
level = "info"
file = "data/mytgfs.log"
# 单个日志文件最大 MB
max_size_mb = 10
# 保留的历史文件数
max_backups = 5
# 保留天数
max_age_days = 7
