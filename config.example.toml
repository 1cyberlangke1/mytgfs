# mytgfs 配置模板
#
# 使用方法：复制为 config.toml 后填入自己的值。
# config.toml 已被 .gitignore 忽略，不会提交。
# 敏感值（api_hash / bot_token / user session）放 secrets/ 目录，不要写进本文件。

[telegram]
# my.telegram.org/apps 申请到的 App api_id（数字）
api_id = 0
# api_hash 不放这里，放 secrets/api_hash（单行 32 位 hex）
api_hash_file = "secrets/api_hash"
# bot token 放 secrets/bot_token（单行）
bot_token_file = "secrets/bot_token"
# 私有频道：channel_id + access_hash 由 channel init 打印
channel_id = 0
access_hash = 0
# Bot API 风格的 chat_id（-100 前缀），仅展示用
chat_id = 0

[mount]
# 默认挂载点（仅记录用，WebDAV 映射盘符由 setup-webdav.ps1 / 面板决定）
point = ""
# 托盘/面板自动增量同步间隔（秒）：0 = 默认 15，负数 = 关闭
sync_seconds = 15
# WebDAV 读分片（MB）：0 = 默认 8，范围 1..64；网络慢可调小
read_chunk_mb = 8
# 下载并发连接数：0 = 默认 4，范围 1..8
download_parallel = 4
# 上传并发分片数：0 = 默认 4，范围 1..16
upload_parallel = 4

[web]
# 面板端口：0 = 默认 8720；被占用时自动退回随机端口
port = 8720

[webdav]
# 是否把卷挂成网络驱动器（默认关闭，面板本身已能增删改查）
enabled = false
# 监听地址，只绑本机回环
addr = "127.0.0.1:8080"
# 只暴露这个卷，留空则用第一个启用的卷
# volume = "demo"

[pwa]
# 可安装 + 离线：整段省略即启用下面这套默认配置
# 显式关掉（不输出 manifest、不注册 service worker）
# enabled = false
# 安装到桌面/开始菜单时显示的名字
name = "mytgfs"
# 单个文件允许「离线保存」的上限（MB）：0 = 默认 256，负数 = 不限制
offline_max_mb = 256

[log]
# 日志等级：debug / info / warn / error
level = "info"
file = "data/mytgfs.log"
# 单个日志文件最大 MB
max_size_mb = 10
# 保留的历史文件数
max_backups = 5
# 保留天数
max_age_days = 7
