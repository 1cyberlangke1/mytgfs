name: Release

# 打 tag 即发布：构建三平台二进制、打包、上传到 GitHub Release。
on:
  push:
    tags: ['v*']

# 发布过程不打断：同一 tag 重复触发时排队，不取消已经在跑的那一次。
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  build:
    needs: ci
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux-amd64
            ext: ''
            gui: ''
            archive: tar.gz
          - os: windows-latest
            platform: windows-amd64
            ext: '.exe'
            gui: '-H=windowsgui'
            archive: zip
          - os: macos-latest
            platform: darwin-arm64
            ext: ''
            gui: ''
            archive: tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      # 前端产物由 ci 的 frontend job 构建并上传，这里直接复用，
      # 不再在每个平台重跑一次 npm ci + vite build。
      - name: 下载前端产物
        uses: actions/download-artifact@v8
        with:
          name: web-dist
          path: internal/web/dist
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      # Wails v3 桌面壳在 Linux 走 cgo + GTK4/WebKitGTK 6.0，缺开发包会导致 pkg-config 失败
      - name: 安装 Linux 桌面依赖
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-4-dev libwebkitgtk-6.0-dev libsoup-3.0-dev
      - name: 构建
        shell: bash
        run: |
          set -euo pipefail
          ver="${GITHUB_REF_NAME#v}"
          commit="$(git rev-parse --short HEAD)"
          date="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          ld="-s -w -X mytgfs/internal/version.Version=$ver -X mytgfs/internal/version.Commit=$commit -X mytgfs/internal/version.Date=$date"
          mkdir -p dist
          go build -trimpath -ldflags "$ld" -o "dist/mytgfs${{ matrix.ext }}" ./cmd/mytgfs
          go build -trimpath -tags noweb -ldflags "$ld" -o "dist/mytgfs-cli${{ matrix.ext }}" ./cmd/mytgfs
          go build -trimpath -ldflags "$ld ${{ matrix.gui }}" -o "dist/mytgfs-tray${{ matrix.ext }}" ./cmd/mytray
      - name: 打包（tar.gz）
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          set -euo pipefail
          pkg="pkg/mytgfs-${GITHUB_REF_NAME}-${{ matrix.platform }}"
          mkdir -p "$pkg"
          cp dist/mytgfs dist/mytgfs-cli dist/mytgfs-tray LICENSE config.example.toml README.md "$pkg"/
          cp packaging/uninstall.ps1 "$pkg"/
          tar -czf "$pkg.tar.gz" -C pkg "$(basename "$pkg")"
      - name: 打包（zip）
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $pkg = "pkg/mytgfs-$env:GITHUB_REF_NAME-${{ matrix.platform }}"
          New-Item -ItemType Directory -Force -Path $pkg | Out-Null
          Copy-Item dist/mytgfs.exe, dist/mytgfs-cli.exe, dist/mytgfs-tray.exe, LICENSE, config.example.toml, README.md $pkg -Force
          Copy-Item packaging/install.ps1, packaging/uninstall.ps1 $pkg -Force
          Compress-Archive -Path "$pkg/*" -DestinationPath "$pkg.zip"
      - name: 上传构建产物
        uses: actions/upload-artifact@v7
        with:
          name: mytgfs-${{ matrix.platform }}
          path: pkg/*.zip
          if-no-files-found: ignore
      - name: 上传构建产物（tar.gz）
        if: matrix.archive == 'tar.gz'
        uses: actions/upload-artifact@v7
        with:
          name: mytgfs-${{ matrix.platform }}-tar
          path: pkg/*.tar.gz

  publish:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      # 只取打包产物：ci 还会上传 web-dist 和 coverage，全下会把 index.html、
      # coverage.out 一起传进 Release。
      - name: 下载发布包
        uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: mytgfs-*
          merge-multiple: true
      - name: 发布 Release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
