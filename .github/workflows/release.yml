name: Release

# 打 tag 即发布：构建三平台二进制、打包、上传到 GitHub Release。
on:
  push:
    tags: ['v*']

# 发布过程不打断：同一 tag 重复触发时排队，不取消已经在跑的那一次。
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  # 读同一提交的 CI 运行记录（只读，不重跑）
  actions: read

jobs:
  # 质量门：只读同一提交的 CI 结论，不重复执行。
  # CI 由 push master 触发，tag 通常指向同一个提交，这里等那次运行结束即可。
  # 对比旧做法（把 ci.yml 当子流程再跑一遍）：省掉整套重复 job，也避免
  # master 与 tag 两个 run 同时起 KVM 模拟器导致 CDP 超时。
  # tag 打在从没跑过 CI 的提交上时会明确失败，而不是悄悄放行。
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: 等待同一提交的 CI 结论
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          runs=$(gh api "repos/$REPO/actions/workflows/ci.yml/runs?head_sha=$SHA&per_page=20")
          run_id=$(echo "$runs" | jq -r '[.workflow_runs[]] | sort_by(.created_at) | last | .id // empty')
          if [ -z "$run_id" ]; then
            echo "提交 $SHA 没有 CI 运行记录：先把这个提交推到 master 让 CI 跑完，再打 tag" >&2
            exit 1
          fi
          echo "跟踪 CI run $run_id"
          gh run watch "$run_id" --repo "$REPO" --exit-status --interval 20

  # 前端产物：不再复用 CI 工作流，这里产一份给 build 矩阵嵌入（dist 不入库）。
  # 只构建一次，三个平台共享；lint/单测已由 gate 等待的那次 CI 覆盖。
  frontend:
    needs: gate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json
      - name: 安装前端依赖
        working-directory: web
        run: npm ci --no-audit --no-fund
      - name: 构建前端
        working-directory: web
        run: npm run build
      - name: 上传前端产物
        uses: actions/upload-artifact@v7
        with:
          name: web-dist
          path: web/dist
          if-no-files-found: error

  build:
    needs: [gate, frontend]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux-amd64
            ext: ''
            gui: ''
            archive: tar.gz
          - os: windows-latest
            platform: windows-amd64
            ext: '.exe'
            gui: '-H=windowsgui'
            archive: zip
          - os: macos-latest
            platform: darwin-arm64
            ext: ''
            gui: ''
            archive: tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      # 前端产物由 ci 的 frontend job 构建并上传，这里直接复用，
      # 不再在每个平台重跑一次 npm ci + vite build。
      - name: 下载前端产物
        uses: actions/download-artifact@v8
        with:
          name: web-dist
          path: internal/web/dist
      # 与 ci.yml 一致：显式缓存 + restore-keys，go.sum 变动时也能复用老快照，
      # 免得 macOS 上 wails 的 cgo 全量重编
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - name: 解析 Go 缓存目录
        id: goenv
        shell: bash
        run: |
          echo "mod=$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"
          echo "build=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
      - name: 恢复 Go 模块与编译缓存
        uses: actions/cache@v6
        with:
          path: |
            ${{ steps.goenv.outputs.mod }}
            ${{ steps.goenv.outputs.build }}
          key: go-${{ runner.os }}-${{ hashFiles('go.sum') }}
          restore-keys: |
            go-${{ runner.os }}-
      # Wails v3 桌面壳在 Linux 走 cgo + GTK4/WebKitGTK 6.0，缺开发包会导致 pkg-config 失败
      - name: 安装 Linux 桌面依赖
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-4-dev libwebkitgtk-6.0-dev libsoup-3.0-dev
      - name: 构建
        shell: bash
        run: |
          set -euo pipefail
          ver="${GITHUB_REF_NAME#v}"
          commit="$(git rev-parse --short HEAD)"
          date="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          ld="-s -w -X mytgfs/internal/version.Version=$ver -X mytgfs/internal/version.Commit=$commit -X mytgfs/internal/version.Date=$date"
          mkdir -p dist
          go build -trimpath -ldflags "$ld" -o "dist/mytgfs${{ matrix.ext }}" ./cmd/mytgfs
          go build -trimpath -tags noweb -ldflags "$ld" -o "dist/mytgfs-cli${{ matrix.ext }}" ./cmd/mytgfs
          go build -trimpath -ldflags "$ld ${{ matrix.gui }}" -o "dist/mytgfs-tray${{ matrix.ext }}" ./cmd/mytray
      - name: 打包（tar.gz）
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          set -euo pipefail
          pkg="pkg/mytgfs-${GITHUB_REF_NAME}-${{ matrix.platform }}"
          mkdir -p "$pkg"
          cp dist/mytgfs dist/mytgfs-cli dist/mytgfs-tray LICENSE config.example.toml README.md "$pkg"/
          cp packaging/uninstall.ps1 "$pkg"/
          tar -czf "$pkg.tar.gz" -C pkg "$(basename "$pkg")"
      - name: 打包（zip）
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $pkg = "pkg/mytgfs-$env:GITHUB_REF_NAME-${{ matrix.platform }}"
          New-Item -ItemType Directory -Force -Path $pkg | Out-Null
          Copy-Item dist/mytgfs.exe, dist/mytgfs-cli.exe, dist/mytgfs-tray.exe, LICENSE, config.example.toml, README.md $pkg -Force
          Copy-Item packaging/install.ps1, packaging/uninstall.ps1 $pkg -Force
          Compress-Archive -Path "$pkg/*" -DestinationPath "$pkg.zip"
      - name: 上传构建产物
        uses: actions/upload-artifact@v7
        with:
          name: mytgfs-${{ matrix.platform }}
          path: pkg/*.zip
          if-no-files-found: ignore
      - name: 上传构建产物（tar.gz）
        if: matrix.archive == 'tar.gz'
        uses: actions/upload-artifact@v7
        with:
          name: mytgfs-${{ matrix.platform }}-tar
          path: pkg/*.tar.gz

  # 安卓 APK：真机是 arm64-v8a，模拟器用的 x86_64 包不对外发。
  # 签名的 4 项都从 Secrets 读（build/android/app/build.gradle 认这些环境变量）。
  # 没有 keystore 时 gradle 会回退 debug 签名，那种包每次 CI 机器都是新生成的
  # 随机密钥，签名一变用户就无法覆盖升级，所以这里直接拒绝缺密钥的构建。
  android:
    needs: gate
    runs-on: ubuntu-24.04
    env:
      ANDROID_KEYSTORE_FILE: ${{ github.workspace }}/release.jks
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
      # AGP 8.7.3 只支持到 JDK 21
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: gradle/actions/setup-gradle@v4
      - name: 安装前端依赖
        working-directory: web
        run: npm ci --no-audit --no-fund
      # NDK 解压后有 2 GB 多，命中缓存就跳过下载安装
      - name: 恢复 Android NDK
        id: ndk
        uses: actions/cache@v6
        with:
          path: ${{ env.ANDROID_HOME }}/ndk/28.2.13676358
          key: ndk-28.2.13676358-${{ runner.os }}
      - name: 安装 Android NDK
        if: steps.ndk.outputs.cache-hit != 'true'
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdkmanager" --licenses > /dev/null
          "$sdkmanager" "ndk;28.2.13676358"
      - name: 还原签名密钥
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "缺少 ANDROID_KEYSTORE_BASE64，无法产出可覆盖升级的 APK" >&2
            exit 1
          fi
          printf '%s\n' "$KEYSTORE_BASE64" | base64 -d > "$ANDROID_KEYSTORE_FILE"
          test -s "$ANDROID_KEYSTORE_FILE"
      - name: 构建 arm64 正式包
        run: pwsh -NoProfile -File build-android.ps1 -Abi arm64-v8a -Task assembleRelease
      - name: 上传 APK
        uses: actions/upload-artifact@v7
        with:
          name: mytgfs-android-arm64
          path: build/mytgfs-*-android-arm64-v8a.apk
          if-no-files-found: error

  publish:
    needs: [build, android]
    runs-on: ubuntu-24.04
    steps:
      # 只取发布包：本工作流的 frontend job 也会上传 web-dist，全下会把
      # index.html 一起传进 Release。
      - name: 下载发布包
        uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: mytgfs-*
          merge-multiple: true
      - name: 发布 Release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
