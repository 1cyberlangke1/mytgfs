name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  # 纯 Go 构建：WebDAV 时代已无 FUSE/cgofuse，不需要任何系统 SDK 或 CGO flags。
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      # macOS 上 systray 需要 cgo，runner 自带 Xcode clang；Windows/Linux 纯 Go 无需 cgo。
      - name: 构建
        run: go build ./...
      - name: 静态检查
        run: go vet ./...
      - name: 测试
        run: go test ./... -cover

  # 前端：TypeScript 类型检查（产物 app.js 已内嵌，不需要在 CI 里重新打包）
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: 安装前端依赖
        working-directory: web
        run: npm ci --no-audit --no-fund
      - name: 类型检查
        working-directory: web
        run: npx tsc --noEmit
