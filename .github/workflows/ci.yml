name: CI

on:
  workflow_call:
  push:
    branches: [master, main]
  pull_request:

# 同一 ref 只保留最新一次运行：旧提交的测试结果没有意义，直接取消省额度。
# 组名带 ci- 前缀，避免和 Release 工作流互相取消。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 纯 Go 构建：不需要任何系统 SDK 或 CGO flags。
  # 三个平台都跑完整的 build / vet / test，平台差异（路径分隔符、注册表、
  # 托盘构建标签）由各自的 runner 验证。
  # 前端产物由 frontend job 构建并上传，这里下载后嵌入二进制（dist 不入库）。
  build:
    needs: frontend
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: 下载前端产物
        uses: actions/download-artifact@v8
        with:
          name: web-dist
          path: internal/web/dist
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      # Wails v3 的 Linux 桌面壳走 cgo + GTK4/WebKitGTK 6.0，缺开发包会导致 pkg-config 失败。
      - name: 安装 Linux 桌面依赖
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # --no-install-recommends 少装推荐包，pkg-config 需要的依赖都在 Depends 里
          sudo apt-get install -y --no-install-recommends libgtk-4-dev libwebkitgtk-6.0-dev libsoup-3.0-dev
      # macOS 上 systray 需要 cgo，runner 自带 Xcode clang；Windows 纯 Go 无需 cgo。
      - name: 构建
        run: go build ./...
      - name: 静态检查
        run: go vet ./...
      # 轻量构建：不带 web/tray，只用 -tags noweb 验证纯命令行版能编译。
      - name: 构建纯命令行版
        shell: bash
        run: |
          out=build/mytgfs-cli
          if [ "$RUNNER_OS" = "Windows" ]; then out=$out.exe; fi
          go build -tags noweb -o "$out" ./cmd/mytgfs
      - name: 格式检查
        if: runner.os == 'Linux'
        run: |
          unformatted=$(gofmt -l cmd internal)
          if [ -n "$unformatted" ]; then
            echo "以下文件未格式化："
            echo "$unformatted"
            exit 1
          fi
      # Linux 额外开竞态检测与覆盖率；Windows/macOS 跑普通测试覆盖平台分支。
      - name: 测试（竞态 + 覆盖率）
        if: runner.os == 'Linux'
        run: go test -count=1 -race -covermode=atomic -coverprofile=coverage.out ./...
      - name: 测试
        if: runner.os != 'Linux'
        run: go test -count=1 ./... -cover
      # 端到端：全部平台跑「网页版面板 + 系统 Chrome」这一路（headless CDP，三平台都能跑）。
      # Windows 另外跑一遍真实 Wails 桌面壳：CDP 是 Chromium 协议，只有 WebView2 能开调试端口。
      - name: 安装 Node（e2e 驱动）
        uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: 构建网页版 e2e 二进制
        shell: bash
        run: |
          exe=build/mytgfs-e2e
          if [ "$RUNNER_OS" = "Windows" ]; then exe=$exe.exe; fi
          go build -tags e2e -o "$exe" ./cmd/mytgfs
      - name: 网页版键盘 e2e
        run: node web/scripts/e2e-keyboard.mjs --target=web
      - name: 构建桌面壳 e2e 二进制
        if: runner.os == 'Windows'
        run: go build -tags e2e -ldflags "-H=windowsgui" -o build/mytgfs-tray-e2e.exe ./cmd/mytray
      - name: 桌面壳键盘 e2e
        if: runner.os == 'Windows'
        run: node web/scripts/e2e-keyboard.mjs --target=shell
      - name: 覆盖率摘要
        if: runner.os == 'Linux'
        run: go tool cover -func=coverage.out | tail -n 1
      - name: 上传覆盖率
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.out
          if-no-files-found: error

  # 前端：类型检查 + 构建，产物上传给 Go 构建嵌入（dist 不入库，每次构建现做）。
  frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json
      - name: 安装前端依赖
        working-directory: web
        run: npm ci --no-audit --no-fund
      - name: 类型检查与推送约束
        working-directory: web
        run: npm run lint
      - name: 前端单元测试
        working-directory: web
        run: npm test
      - name: 构建前端
        working-directory: web
        run: npm run build
      - name: 上传前端产物
        uses: actions/upload-artifact@v7
        with:
          name: web-dist
          path: web/dist
          if-no-files-found: error

  # 安卓：编 e2e 包（假数据层），在 KVM 模拟器里跑同一套键盘用例。
  # CDP 走 adb 转发的 WebView devtools 套接字，断言与桌面壳完全一致。
  # 只跑 x86_64 镜像：宿主是 amd64，arm64 镜像只能软件模拟，慢到没意义。
  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      # AGP 8.7.3 支持到 JDK 21；JDK 25 会在 Gradle 配置阶段报不支持
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: 安装前端依赖
        working-directory: web
        run: npm ci --no-audit --no-fund
      # runner 预装的 NDK 版本不确定；build-android.ps1 取 ndk 目录下最大的版本，
      # 这里显式装一个，避免拿到过旧版本
      - name: 安装 Android NDK
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdkmanager" --licenses > /dev/null
          "$sdkmanager" "ndk;28.2.13676358"
      # 模拟器要硬件加速，ubuntu runner 默认不允许普通用户访问 /dev/kvm
      - name: 启用 KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' |
            sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: 构建安卓 e2e 包
        run: pwsh -NoProfile -File build-android.ps1 -Abi x86_64 -E2E
      - name: 模拟器里跑键盘 e2e
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
          script: node web/scripts/e2e-keyboard.mjs --target=android

  # 漏洞扫描：只对「代码实际调用到」的漏洞报错；标准库漏洞随 go.mod 的 go 版本一起修。
  # Release 复用本工作流，因此这里失败会挡住发版。
  # 跑在 Windows 上：wails v3 的 Linux 后端是 cgo + GTK/WebKit，缺开发包时
  # govulncheck 连包都加载不了；Windows 后端是纯 Go，不需要额外系统依赖。
  security:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: 安装 govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: 漏洞扫描
        run: govulncheck ./...
